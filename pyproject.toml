[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "twr-offline-recovery"
version = "0.1.0"
description = "Validation and deterministic reconstruction tooling for TWR Offline"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
