name: TWR Offline Windows Build

on:
  workflow_dispatch:
  push:
    branches: [twr-offline-dev, twr-pass29-integration, twr-pass30-gameplay-validation, twr-pass31-navigation-repair, twr-pass32-grounded-navigation, twr-pass33-navigation-cache, twr-pass34-original-client-walls, twr-pass35-infected-walls, twr-pass36-source-map-fragments, twr-pass37-source-lighting, twr-pass38-source-soundscapes, twr-pass39-original-laboratory, twr-pass40-grounded-lab-navigation, twr-pass41-source-native-bridges, twr-pass42-jump-navigation, twr-pass43-physical-jump-verification, twr-pass44-native-lab-streaming, twr-pass45-lab-proxy-visibility, twr-pass46-offline-original-art, twr-pass47-original-weapon-assemblies, twr-pass48-infected-source-asset-kit, twr-pass49-original-lobby-3d, twr-pass50-original-bulletin-board, twr-pass51-original-loadout-preview, twr-pass52-source-loadout-and-shop, twr-pass53-offline-skin-cases, twr-pass54-original-skin-materials, twr-pass55-source-skin-textures-and-shimmer, twr-pass56-source-wiki-gallery, twr-pass57-offline-source-weapon-geometry, twr-pass58-original-weapon-silhouettes, twr-pass59-source-weapon-motion, twr-pass60-source-weapon-animations, twr-pass61-source-weapon-cycling, twr-pass62-source-subassembly-hierarchy, twr-pass63-source-magazine-reload, twr-pass64-source-shell-and-bolt, twr-pass65-source-hand-grips, twr-pass66-articulated-source-arms, twr-pass67-source-sight-alignment, twr-pass68-original-aimcf, twr-pass69-source-optical-reticles, twr-pass70-live-player-combat-loop, twr-pass71-native-multimap-damage, twr-pass72-native-ten-map-entry, twr-pass73-fullmap-ground-navigation, twr-pass74-special-infected-safety, twr-pass75-blast-line-of-sight, twr-pass76-interaction-objective-fortification, twr-pass77-manor-stair-traversal, twr-pass78-manor-bidirectional-stairs, twr-pass83-manor-upper-gameplay, twr-pass88-physical-wave-hardening, twr-pass89-escort-ground-navigation, twr-pass90-escort-completion-rewards, twr-pass91-multimap-escort, twr-pass92-expressway-escort, twr-pass93-escort-completion-safety, twr-pass94-manor-stair-escort, twr-pass95-manor-escort-rotation, twr-pass96-grounded-material-objectives, twr-pass97-unified-gameplay, twr-pass98-material-objective-completion, twr-pass99-global-material-carry, twr-pass100-physical-material-walk, twr-pass101-spawn-objective-walk, twr-pass102-remaining-spawn-ingress, twr-pass103-full-physical-load, twr-pass104-full-physical-repair, twr-pass105-live-objective-threat, twr-pass106-material-models-and-carry-view, twr-pass107-carry-aim-safe-presentation, twr-pass108-native-carry-ads-frustum, twr-pass109-reference-generator-repair-icon, twr-pass110-repair-vehicle-assembly, twr-pass111-bounded-infected-corpse-fall, twr-pass112-articulated-infected-death-pose, twr-pass113-ground-contact-corpse-settling, twr-pass114-slope-aligned-corpse-settling, twr-pass115-laboratory-reference-dressing, twr-pass116-laboratory-surface-materials, twr-pass117-original-laboratory-private-installer, twr-pass118-stable-native-shutdown]
    paths:
      - 'src/**'
      - 'content/**'
      - 'tools/**'
      - 'tests/**'
      - 'build/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read
  actions: write

jobs:
  validate-and-export:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Remove previously uploaded Windows build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Source code remains public, but previously uploaded executables are removed.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $matching = @()
          $page = 1
          do {
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page"
            $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            $batch = @($response.artifacts)
            $matching += @($batch | Where-Object { $_.name -eq 'ThoseWhoRemainOffline-Windows-x64' })
            $page++
          } while ($batch.Count -eq 100)
          foreach ($artifact in $matching) {
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)"
            Invoke-RestMethod -Method Delete -Uri $url -Headers $headers | Out-Null
          }
          Write-Host "Removed $($matching.Count) previously uploaded Windows build artifact(s)."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'

      - name: Install validation dependencies
        shell: pwsh
        run: python -m pip install -e .[test]

      - name: Validate evidence/content/domain contracts
        shell: pwsh
        run: python tools/validation/run_all.py

      - name: Bootstrap pinned Godot .NET and export Windows build
        shell: pwsh
        run: .\build\Windows\build.ps1 -BootstrapToolchain -SkipTests

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'build/output/ThoseWhoRemainOffline.exe')) { throw 'Missing Windows executable' }

      - name: Preflight Pass 111 native Glock kill and corpse lifecycle
        if: success() && (github.ref_name == 'twr-pass111-bounded-infected-corpse-fall' || (github.ref_name == 'twr-pass112-articulated-infected-death-pose' || (github.ref_name == 'twr-pass113-ground-contact-corpse-settling' || (github.ref_name == 'twr-pass114-slope-aligned-corpse-settling' || (github.ref_name == 'twr-pass115-laboratory-reference-dressing' || (github.ref_name == 'twr-pass116-laboratory-surface-materials' || (github.ref_name == 'twr-pass117-original-laboratory-private-installer' || github.ref_name == 'twr-pass118-stable-native-shutdown')))))))
        shell: pwsh
        run: |
          $source = 'build/output/Content/Weapons/SourceWeaponModels.json.gz'
          $hierarchy = 'build/output/Content/Weapons/SourceWeaponMotorHierarchy62.json.gz'
          python tools/maps/make_pass68_aimcf_fixture.py --source $source --hierarchy $hierarchy --create
          if($LASTEXITCODE -ne 0){ throw 'Pass111 synthetic original-style Glock fixture creation failed' }
          try {
            $stdout = Join-Path $env:RUNNER_TEMP 'pass111-corpse.stdout.txt'
            $stderr = Join-Path $env:RUNNER_TEMP 'pass111-corpse.stderr.txt'
            $exe = (Resolve-Path 'build/output/ThoseWhoRemainOffline.exe').Path
            $run = Start-Process -FilePath $exe -ArgumentList @('--headless','--verbose','--quit-after','1800','--','--smoke-pass111') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $output = @()
            if(Test-Path $stdout){$output += Get-Content $stdout}
            if(Test-Path $stderr){$output += Get-Content $stderr}
            $output | ForEach-Object {Write-Host $_}
            if($run.ExitCode -ne 0){
              throw "Pass111 actual native Glock kill/death visual failed: exit $($run.ExitCode)"
            }
            $matching = @($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS111_INFECTED_CORPSE_OK actual_camera_ray_weapon_kill=true corpse_mesh_parts=[0-9]+ noncolliding=true reuses_infected_render_materials=true bounded_to_16=true short_lifetime_seconds=5.5 wave_cleanup=true credits_xp_unchanged=true original_ragdoll_unverified=true'})
            if($matching.Count -ne 1){
              throw "Pass111 did not verify the genuine Glock corpse visual and wave cleanup"
            }
            $parts = [regex]::Match($matching[0], 'corpse_mesh_parts=([0-9]+)')
            if(-not $parts.Success -or [int]$parts.Groups[1].Value -lt 8 -or
               [int]$parts.Groups[1].Value -gt 64){
              throw "Pass111 snapshot violates visible corpse mesh budget"
            }
            if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS70_LIVE_COMBAT_OK exported_windows_gameplay_root=true '})){
              throw "Pass111 broke the original real weapon, reload and Wave2 combat acceptance"
            }
          } finally {
            python tools/maps/make_pass68_aimcf_fixture.py --source $source --hierarchy $hierarchy --clean
            if($LASTEXITCODE -ne 0){ throw 'Pass111 source-safe synthetic viewmodel fixture cleanup failed' }
          }

      - name: Preflight Pass 112 real Glock articulated corpse limb motion
        if: success() && (github.ref_name == 'twr-pass112-articulated-infected-death-pose' || (github.ref_name == 'twr-pass113-ground-contact-corpse-settling' || (github.ref_name == 'twr-pass114-slope-aligned-corpse-settling' || (github.ref_name == 'twr-pass115-laboratory-reference-dressing' || (github.ref_name == 'twr-pass116-laboratory-surface-materials' || (github.ref_name == 'twr-pass117-original-laboratory-private-installer' || github.ref_name == 'twr-pass118-stable-native-shutdown'))))))
        shell: pwsh
        run: |
          $source = 'build/output/Content/Weapons/SourceWeaponModels.json.gz'
          $hierarchy = 'build/output/Content/Weapons/SourceWeaponMotorHierarchy62.json.gz'
          python tools/maps/make_pass68_aimcf_fixture.py --source $source --hierarchy $hierarchy --create
          if($LASTEXITCODE -ne 0){ throw 'Pass112 temporary smoke-only synthetic Glock pack creation failed' }
          try {
            $stdout = Join-Path $env:RUNNER_TEMP 'pass112-death-limbs.stdout.txt'
            $stderr = Join-Path $env:RUNNER_TEMP 'pass112-death-limbs.stderr.txt'
            $exe = (Resolve-Path 'build/output/ThoseWhoRemainOffline.exe').Path
            $run = Start-Process -FilePath $exe -ArgumentList @('--headless','--verbose','--quit-after','1800','--','--smoke-pass112') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $output = @()
            if(Test-Path $stdout){$output += Get-Content $stdout}
            if(Test-Path $stderr){$output += Get-Content $stderr}
            $output | ForEach-Object {Write-Host $_}
            if($run.ExitCode -ne 0){
              throw "Pass112 actual Glock shot, death limb posing and cleanup failed: exit $($run.ExitCode)"
            }
            $hit = @($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS112_ARTICULATED_CORPSE_OK source_r6_limb_pivots=4 correctly_grouped_meshes=[0-9]+ actual_glock_kill=true independent_limb_fall=true root_fall_preserved=true no_physics_colliders=true real_wave_cleanup=true synthetic_glock_fixture_only=true original_motor6d_data_unverified=true'})
            if($hit.Count -ne 1){
              throw "Pass112 missing independent actual-infected limb movement across reload"
            }
            $parts = [regex]::Match($hit[0], 'correctly_grouped_meshes=([0-9]+)')
            if(-not $parts.Success -or [int]$parts.Groups[1].Value -lt 6){
              throw "Pass112 did not animate at least six source R6 limb-part meshes"
            }
            if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS111_INFECTED_CORPSE_OK actual_camera_ray_weapon_kill=true '})){
              throw "Pass112 broke Pass111 real Glock death/body cleanup"
            }
            if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS70_LIVE_COMBAT_OK exported_windows_gameplay_root=true '})){
              throw "Pass112 broke previous ammo, reward, reload and second wave"
            }
          } finally {
            python tools/maps/make_pass68_aimcf_fixture.py --source $source --hierarchy $hierarchy --clean
            if($LASTEXITCODE -ne 0){throw 'Pass112 source-safe synthetic gun fixture cleanup failed'}
          }

      - name: Preflight Pass 113 real corpse ground settling after Glock kill
        if: success() && (github.ref_name == 'twr-pass113-ground-contact-corpse-settling' || (github.ref_name == 'twr-pass114-slope-aligned-corpse-settling' || (github.ref_name == 'twr-pass115-laboratory-reference-dressing' || (github.ref_name == 'twr-pass116-laboratory-surface-materials' || (github.ref_name == 'twr-pass117-original-laboratory-private-installer' || github.ref_name == 'twr-pass118-stable-native-shutdown')))))
        shell: pwsh
        run: |
          $source = 'build/output/Content/Weapons/SourceWeaponModels.json.gz'
          $hierarchy = 'build/output/Content/Weapons/SourceWeaponMotorHierarchy62.json.gz'
          python tools/maps/make_pass68_aimcf_fixture.py --source $source --hierarchy $hierarchy --create
          if($LASTEXITCODE -ne 0){throw 'Pass113 temporary synthetic Glock rig setup failed'}
          try {
            $stdout = Join-Path $env:RUNNER_TEMP 'pass113-grounded-corpse.stdout.txt'
            $stderr = Join-Path $env:RUNNER_TEMP 'pass113-grounded-corpse.stderr.txt'
            $exe = (Resolve-Path 'build/output/ThoseWhoRemainOffline.exe').Path
            $run = Start-Process -FilePath $exe -ArgumentList @('--headless','--verbose','--quit-after','1800','--','--smoke-pass113') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $output = @()
            if(Test-Path $stdout){$output += Get-Content $stdout}
            if(Test-Path $stderr){$output += Get-Content $stderr}
            $output | ForEach-Object {Write-Host $_}
            if($run.ExitCode -ne 0){
              throw "Pass113 actual Glock-death terrain settling failed: exit $($run.ExitCode)"
            }
            $hits = @($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS113_CORPSE_GROUND_OK real_glock_kill=true one_static_floor_probe=true true_terrain_collision=true static_body_only=true normal_y=[0-9.]+ correction_m=-?[0-9.]+ contact_error_m=[0-9.]+ articulated_limbs=4 zero_added_colliders=true rewards_and_wave_preserved=true original_ragdoll_ground_physics_unverified=true'})
            if($hits.Count -ne 1){
              throw "Pass113 did not report normal, correction and low-ground-contact error from real floor"
            }
            $match = [regex]::Match($hits[0], 'normal_y=([0-9.]+) correction_m=(-?[0-9.]+) contact_error_m=([0-9.]+)')
            if(-not $match.Success){throw 'Pass113 ground numeric evidence missing'}
            $culture = [System.Globalization.CultureInfo]::InvariantCulture
            $normal = [double]::Parse($match.Groups[1].Value,$culture)
            $offset = [double]::Parse($match.Groups[2].Value,$culture)
            $errorMeters = [double]::Parse($match.Groups[3].Value,$culture)
            if($normal -lt 0.58 -or [math]::Abs($offset) -lt 0.02 -or
               [math]::Abs($offset) -gt 2.75 -or $errorMeters -gt 0.045){
              throw "Pass113 corpse not resting on valid floor: normal=$normal correction=$offset gap=$errorMeters"
            }
            if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS112_ARTICULATED_CORPSE_OK source_r6_limb_pivots=4 '})){
              throw 'Pass113 broke four-limb R6 corpse motion'
            }
            if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS111_INFECTED_CORPSE_OK actual_camera_ray_weapon_kill=true '})){
              throw 'Pass113 broke bounded noncolliding death snapshots'
            }
            if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS70_LIVE_COMBAT_OK exported_windows_gameplay_root=true '})){
              throw 'Pass113 broke real ammo, credits/XP, reload or wave transition'
            }
          } finally {
            python tools/maps/make_pass68_aimcf_fixture.py --source $source --hierarchy $hierarchy --clean
            if($LASTEXITCODE -ne 0){throw 'Pass113 fixture cleanup failed'}
          }

      - name: Preflight Pass 114 real Glock death on sloped terrain
        if: success() && (github.ref_name == 'twr-pass114-slope-aligned-corpse-settling' || (github.ref_name == 'twr-pass115-laboratory-reference-dressing' || (github.ref_name == 'twr-pass116-laboratory-surface-materials' || (github.ref_name == 'twr-pass117-original-laboratory-private-installer' || github.ref_name == 'twr-pass118-stable-native-shutdown'))))
        shell: pwsh
        run: |
          $source = 'build/output/Content/Weapons/SourceWeaponModels.json.gz'
          $hierarchy = 'build/output/Content/Weapons/SourceWeaponMotorHierarchy62.json.gz'
          python tools/maps/make_pass68_aimcf_fixture.py --source $source --hierarchy $hierarchy --create
          if($LASTEXITCODE -ne 0){throw 'Pass114 temporary source-style Glock model creation failed'}
          try {
            $stdout = Join-Path $env:RUNNER_TEMP 'pass114-sloped-death.stdout.txt'
            $stderr = Join-Path $env:RUNNER_TEMP 'pass114-sloped-death.stderr.txt'
            $exe = (Resolve-Path 'build/output/ThoseWhoRemainOffline.exe').Path
            $run = Start-Process -FilePath $exe -ArgumentList @('--headless','--verbose','--quit-after','1800','--','--smoke-pass114') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $output = @()
            if(Test-Path $stdout){$output += Get-Content $stdout}
            if(Test-Path $stderr){$output += Get-Content $stderr}
            $output | ForEach-Object {Write-Host $_}
            if($run.ExitCode -ne 0){throw "Pass114 real Glock + physical slope settling failed: exit $($run.ExitCode)"}
            $matches = @($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS114_SLOPE_CORPSE_OK real_glock_kill=true sloped_static_terrain=true normal_y=[0-9.]+ tilt_radians=[0-9.]+ plane_clearance_error_m=[0-9.]+ independently_articulated_r6=true no_physics_corpse_added=true credits_xp_ammo_wave_preserved=true actual_motor6d_constraint_ragdoll_unverified=true'})
            if($matches.Count -ne 1){throw 'Pass114 did not verify real incline-dependent corpse pose'}
            $measure = [regex]::Match($matches[0], 'normal_y=([0-9.]+) tilt_radians=([0-9.]+) plane_clearance_error_m=([0-9.]+)')
            if(-not $measure.Success){throw 'Pass114 native sloped floor measurements were missing'}
            $culture = [System.Globalization.CultureInfo]::InvariantCulture
            $normal = [double]::Parse($measure.Groups[1].Value,$culture)
            $tilt = [double]::Parse($measure.Groups[2].Value,$culture)
            $gap = [double]::Parse($measure.Groups[3].Value,$culture)
            if($normal -lt 0.90 -or $normal -gt 0.99 -or
               $tilt -lt 0.14 -or $tilt -gt 0.35 -or
               $gap -gt 0.045){
              throw "Pass114 invalid original-mesh terrain plane landing: normal=$normal tilt=$tilt gap=$gap"
            }
            if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS113_CORPSE_GROUND_OK real_glock_kill=true '})){
              throw 'Pass114 broke the original flat/static corpse floor detection rules'
            }
            if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS112_ARTICULATED_CORPSE_OK source_r6_limb_pivots=4 '})){
              throw 'Pass114 broke four source R6 independent limb pivots'
            }
            if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS111_INFECTED_CORPSE_OK actual_camera_ray_weapon_kill=true '})){
              throw 'Pass114 broke original bounded corpse snapshot'
            }
            if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS70_LIVE_COMBAT_OK exported_windows_gameplay_root=true '})){
              throw 'Pass114 broke actual Glock ammo, credits, XP, reload or Wave2 transition'
            }
          } finally {
            python tools/maps/make_pass68_aimcf_fixture.py --source $source --hierarchy $hierarchy --clean
            if($LASTEXITCODE -ne 0){throw 'Pass114 synthetic fixture cleanup failed'}
          }

      - name: Preflight Pass 115 seven Laboratory visual landmark zones in all ten real maps
        if: success() && (github.ref_name == 'twr-pass115-laboratory-reference-dressing' || (github.ref_name == 'twr-pass116-laboratory-surface-materials' || (github.ref_name == 'twr-pass117-original-laboratory-private-installer' || github.ref_name == 'twr-pass118-stable-native-shutdown')))
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'pass115-laboratory-dressing.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'pass115-laboratory-dressing.stderr.txt'
          $exe = (Resolve-Path 'build/output/ThoseWhoRemainOffline.exe').Path
          $run = Start-Process -FilePath $exe -ArgumentList @('--headless','--verbose','--quit-after','420000','--','--smoke-pass115') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = @()
          if(Test-Path $stdout){$output += Get-Content $stdout}
          if(Test-Path $stderr){$output += Get-Content $stderr}
          $output | ForEach-Object {Write-Host $_}
          if($run.ExitCode -ne 0){
            throw "Pass115 actual ten-map Laboratory render-only visual/wave acceptance failed: exit $($run.ExitCode)"
          }
          $marks = @($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS115_LAB_DRESSING_OK maps=10 lab_fallback_scenes=1 landmark_zones=7 visual_meshes=[0-9]+ local_lights=[0-9]+ other_maps_undressed=9 zero_new_colliders=true two_native_waves_each=true original_owner_assets_excluded=true screenshot_exact_fidelity_unverified=true'})
          if($marks.Count -ne 1){
            throw 'Pass115 did not preserve exactly one complete original-free Laboratory dressing scene'
          }
          $counts = [regex]::Match($marks[0], 'visual_meshes=([0-9]+) local_lights=([0-9]+)')
          if(-not $counts.Success -or [int]$counts.Groups[1].Value -lt 140 -or
             [int]$counts.Groups[1].Value -gt 260 -or
             [int]$counts.Groups[2].Value -lt 8){
            throw 'Pass115 Laboratory screenshot-guided scene exceeds visual budget or is missing props/lights'
          }
          if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS72_TEN_MAP_ENTRY_OK maps=10 actual_gameplay_roots=true '})){
            throw 'Pass115 dressing broke native ten-map first person ground, pickup or second-wave gameplay'
          }

      - name: Preflight Pass 116 real ten-map Laboratory floor surfaces and emissive fixtures
        if: success() && (github.ref_name == 'twr-pass116-laboratory-surface-materials' || (github.ref_name == 'twr-pass117-original-laboratory-private-installer' || github.ref_name == 'twr-pass118-stable-native-shutdown'))
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'pass116-lab-surfaces.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'pass116-lab-surfaces.stderr.txt'
          $exe = (Resolve-Path 'build/output/ThoseWhoRemainOffline.exe').Path
          $run = Start-Process -FilePath $exe -ArgumentList @('--headless','--verbose','--quit-after','420000','--','--smoke-pass116') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = @()
          if(Test-Path $stdout){$output += Get-Content $stdout}
          if(Test-Path $stderr){$output += Get-Content $stderr}
          $output | ForEach-Object {Write-Host $_}
          if($run.ExitCode -ne 0){
            throw "Pass116 actual ten-map tiled Laboratory renderer and native gameplay failed: exit $($run.ExitCode)"
          }
          $hit = @($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS116_LAB_SURFACES_OK maps=10 lab_material_scenes=1 procedural_patterns=5 repainted_structural_surfaces=13 emissive_fixture_parts=[0-9]+ garage_decal_meshes=10 other_maps_unchanged=9 zero_new_colliders=true original_geometry_unmodified=true native_wave2_each_map=true owner_images_not_bundled=true pixel_parity_unverified=true'})
          if($hit.Count -ne 1){
            throw 'Pass116 missing source-safe clinical tile, industrial concrete, emissive fixtures and garage paint'
          }
          $count = [regex]::Match($hit[0], 'emissive_fixture_parts=([0-9]+)')
          if(-not $count.Success -or [int]$count.Groups[1].Value -lt 28 -or
             [int]$count.Groups[1].Value -gt 48){
            throw 'Pass116 real source-guided emissive fixture count is invalid'
          }
          if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS115_LAB_DRESSING_OK maps=10 lab_fallback_scenes=1 '})){
            throw 'Pass116 unexpectedly removed real Pass115 furniture and lighting source-reference zones'
          }
          if(-not ($output | Where-Object {"$_" -match '^TWR_SMOKE_PASS72_TEN_MAP_ENTRY_OK maps=10 actual_gameplay_roots=true '})){
            throw 'Pass116 broke physical player grounding, two infected waves or ten-map lobby lifecycle'
          }

      - name: Preflight Pass 117 authenticated private Laboratory installer refusal
