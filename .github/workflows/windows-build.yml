name: TWR Offline Windows Build

on:
  workflow_dispatch:
  push:
    branches: [twr-offline-dev, twr-pass29-integration, twr-pass30-gameplay-validation, twr-pass31-navigation-repair, twr-pass32-grounded-navigation, twr-pass33-navigation-cache, twr-pass34-original-client-walls, twr-pass35-infected-walls, twr-pass36-source-map-fragments, twr-pass37-source-lighting, twr-pass38-source-soundscapes, twr-pass39-original-laboratory, twr-pass40-grounded-lab-navigation, twr-pass41-source-native-bridges, twr-pass42-jump-navigation, twr-pass43-physical-jump-verification, twr-pass44-native-lab-streaming, twr-pass45-lab-proxy-visibility, twr-pass46-offline-original-art, twr-pass47-original-weapon-assemblies, twr-pass48-infected-source-asset-kit, twr-pass49-original-lobby-3d, twr-pass50-original-bulletin-board, twr-pass51-original-loadout-preview, twr-pass52-source-loadout-and-shop, twr-pass53-offline-skin-cases, twr-pass54-original-skin-materials, twr-pass55-source-skin-textures-and-shimmer, twr-pass56-source-wiki-gallery, twr-pass57-offline-source-weapon-geometry, twr-pass58-original-weapon-silhouettes, twr-pass59-source-weapon-motion, twr-pass60-source-weapon-animations, twr-pass61-source-weapon-cycling, twr-pass62-source-subassembly-hierarchy, twr-pass63-source-magazine-reload, twr-pass64-source-shell-and-bolt, twr-pass65-source-hand-grips, twr-pass66-articulated-source-arms, twr-pass67-source-sight-alignment, twr-pass68-original-aimcf, twr-pass69-source-optical-reticles, twr-pass70-live-player-combat-loop, twr-pass71-native-multimap-damage, twr-pass72-native-ten-map-entry, twr-pass73-fullmap-ground-navigation]
    paths:
      - 'src/**'
      - 'content/**'
      - 'tools/**'
      - 'tests/**'
      - 'build/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read
  actions: write

jobs:
  validate-and-export:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Remove previously uploaded Windows build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Source code remains public, but previously uploaded executables are removed.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $matching = @()
          $page = 1
          do {
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page"
            $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            $batch = @($response.artifacts)
            $matching += @($batch | Where-Object { $_.name -eq 'ThoseWhoRemainOffline-Windows-x64' })
            $page++
          } while ($batch.Count -eq 100)
          foreach ($artifact in $matching) {
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)"
            Invoke-RestMethod -Method Delete -Uri $url -Headers $headers | Out-Null
          }
          Write-Host "Removed $($matching.Count) previously uploaded Windows build artifact(s)."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'

      - name: Install validation dependencies
        shell: pwsh
        run: python -m pip install -e .[test]

      - name: Validate evidence/content/domain contracts
        shell: pwsh
        run: python tools/validation/run_all.py

      - name: Bootstrap pinned Godot .NET and export Windows build
        shell: pwsh
        run: .\build\Windows\build.ps1 -BootstrapToolchain -SkipTests

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'build/output/ThoseWhoRemainOffline.exe')) { throw 'Missing Windows executable' }

      - name: Smoke test Pass 29 contracts in the exported executable
        shell: pwsh
        run: |
          # Godot's exported GUI executable needs explicit stream redirection
          # on Windows; invoking it with & produces no reliable captured text.
          $stdout = Join-Path $env:RUNNER_TEMP 'pass29-smoke.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'pass29-smoke.stderr.txt'
          $exe = (Resolve-Path 'build/output/ThoseWhoRemainOffline.exe').Path
          $run = Start-Process -FilePath $exe -ArgumentList @('--headless','--verbose','--quit-after','120','--','--smoke-pass29') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = @()
          if (Test-Path $stdout) { $output += Get-Content $stdout }
          if (Test-Path $stderr) { $output += Get-Content $stderr }
          $output | ForEach-Object { Write-Host $_ }
          if ($run.ExitCode -ne 0 -or -not ($output | Where-Object { "$_" -match 'TWR_SMOKE_PASS29_RUNTIME_OK' })) {
            throw "Pass 29 native Windows runtime smoke failed. Exit code: $($run.ExitCode)"
          }

      - name: Smoke Pass 30 fully integrated synthetic Laboratory in exported Windows game
        if: success() && github.ref_name == 'twr-pass30-gameplay-validation'
        shell: pwsh
        run: |
          $outputDir = (Resolve-Path 'build/output').Path
          python tools/validation/make_pass30_synthetic_sidecars.py --output $outputDir --create
          if ($LASTEXITCODE -ne 0) { throw 'Failed to generate synthetic native smoke fixtures' }
          try {
            $stdout = Join-Path $env:RUNNER_TEMP 'pass30-smoke.stdout.txt'
            $stderr = Join-Path $env:RUNNER_TEMP 'pass30-smoke.stderr.txt'
            $exe = (Resolve-Path 'build/output/ThoseWhoRemainOffline.exe').Path
            $run = Start-Process -FilePath $exe -ArgumentList @('--headless','--verbose','--quit-after','240','--','--smoke-pass30') -Wait -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $output = @()
            if (Test-Path $stdout) { $output += Get-Content $stdout }
            if (Test-Path $stderr) { $output += Get-Content $stderr }
            $output | ForEach-Object { Write-Host $_ }
            if ($run.ExitCode -ne 0 -or
                -not ($output | Where-Object { "$_" -match 'TWR_SMOKE_PASS30_GAMEPLAY_OK' }) -or
                -not ($output | Where-Object { "$_" -match 'TWR_SMOKE_PASS30_SOURCE_OK' })) {
              throw "Pass 30 full native integration smoke failed. Exit: $($run.ExitCode)"
            }
          } finally {
            python tools/validation/make_pass30_synthetic_sidecars.py --output $outputDir --clean
            if ($LASTEXITCODE -ne 0) { throw 'Failed to remove synthetic smoke fixtures' }
          }

      - name: Smoke Pass 31 source-bound navigation and F9-assisted entry in exported Windows game
