      - name: Verify no private map scenes entered the CI export
        if: success() && (github.ref_name == 'twr-pass29-integration' || github.ref_name == 'twr-pass30-gameplay-validation' || github.ref_name == 'twr-pass31-navigation-repair' || github.ref_name == 'twr-pass32-grounded-navigation' || github.ref_name == 'twr-pass33-navigation-cache' || github.ref_name == 'twr-pass34-original-client-walls' || github.ref_name == 'twr-pass35-infected-walls' || github.ref_name == 'twr-pass36-source-map-fragments' || github.ref_name == 'twr-pass38-source-soundscapes' || github.ref_name == 'twr-pass39-original-laboratory' || github.ref_name == 'twr-pass40-grounded-lab-navigation' || github.ref_name == 'twr-pass41-source-native-bridges' || github.ref_name == 'twr-pass42-jump-navigation' || github.ref_name == 'twr-pass43-physical-jump-verification' || github.ref_name == 'twr-pass44-native-lab-streaming' || github.ref_name == 'twr-pass45-lab-proxy-visibility' ||  github.ref_name == 'twr-pass46-offline-original-art' || github.ref_name == 'twr-pass47-original-weapon-assemblies' || github.ref_name == 'twr-pass48-infected-source-asset-kit')
        shell: pwsh
        run: |
          $privateScenes = @(Get-ChildItem -Path build/output -Filter '*.scene.jsonl.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($privateScenes.Count -gt 0) { throw 'Private source-map scene was unexpectedly included in CI output' }
          $privateWalls = @(Get-ChildItem -Path build/output -Filter '*.clientwalls34.jsonl.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($privateWalls.Count -gt 0) { throw 'Private Client Walls pack remained in CI artifact' }
          $infectedWalls = @(Get-ChildItem -Path build/output -Filter '*.infectedwalls35.jsonl.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($infectedWalls.Count -gt 0) { throw 'Owner-private infected-wall source pack remained in public CI artifact' }
          $serverWalls = @(Get-ChildItem -Path build/output -Filter '*.serverwalls36.jsonl.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($serverWalls.Count -gt 0) { throw 'Owner-private Server Wall pack remained in public CI output' }
          $sourceObjects = @(Get-ChildItem -Path build/output -Filter '*.objects36.jsonl.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($sourceObjects.Count -gt 0) { throw 'Owner-private source Map Object pack remained in public CI output' }
          $plans = @(Get-ChildItem -Path build/output -Filter '*.sourcefragment36.png' -File -Recurse -ErrorAction SilentlyContinue)
          if ($plans.Count -gt 0) { throw 'Owner-private map plan remained in public CI output' }
          $soundscapes = @(Get-ChildItem -Path build/output -Filter '*.soundscape38.json' -File -Recurse -ErrorAction SilentlyContinue)
          if ($soundscapes.Count -gt 0) { throw 'Owner-private source soundscape metadata remained in public CI output' }
          $tempWavs = Join-Path (Resolve-Path 'build/output').Path 'Content/Audio/MapSounds'
          if (Test-Path $tempWavs) { throw 'Synthetic/original map-local WAV files remained in public CI output' }
          $originalLabMaps = @(Get-ChildItem -Path build/output -Filter '*.sourceplan39-*.png' -File -Recurse -ErrorAction SilentlyContinue)
          if ($originalLabMaps.Count -gt 0) { throw 'Owner-private Laboratory floorplans remained in public output' }
          $originalCollision = @(Get-ChildItem -Path build/output -Filter '*.col26.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($originalCollision.Count -gt 0) { throw 'Owner-private original collision cache remained in public output' }
          $nav31 = @(Get-ChildItem -Path build/output -Filter '*.nav31.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($nav31.Count -gt 0) { throw 'Owner-private or synthetic source navigation graph remained in public output' }
          $navImages = @(Get-ChildItem -Path build/output -Filter '*.navgraph40-*.png' -File -Recurse -ErrorAction SilentlyContinue)
          if ($navImages.Count -gt 0) { throw 'Source navigation diagnostic PNGs remained in public output' }
          $newBridges = @(Get-ChildItem -Path build/output -Filter '*.nav41.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($newBridges.Count -gt 0) { throw 'Private Pass41 source repaired navigation leaked into public output' }
          $repairImages = @(Get-ChildItem -Path build/output -Filter '*.navgraph41-*.png' -File -Recurse -ErrorAction SilentlyContinue)
          if ($repairImages.Count -gt 0) { throw 'Private Pass41 repaired Laboratory map plans leaked into public output' }
          $jumpNav = @(Get-ChildItem -Path build/output -Filter '*.nav42.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($jumpNav.Count -gt 0) { throw 'Pass42 source jump navigation leaked into public Windows output' }
          $jumpPlans = @(Get-ChildItem -Path build/output -Filter '*.navgraph42-*.png' -File -Recurse -ErrorAction SilentlyContinue)
          if ($jumpPlans.Count -gt 0) { throw 'Pass42 source jump floorplan images leaked into public Windows output' }
          $nativeParts = @(Get-ChildItem -Path build/output -Filter '*.native28.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($nativeParts.Count -gt 0) { throw 'Pass44 original native Part cache or synthetic fixture leaked into public Windows output' }
          $nativeManifests = @(Get-ChildItem -Path build/output -Filter 'LABORATORY_NATIVE_RENDER_MANIFEST44.json' -File -Recurse -ErrorAction SilentlyContinue)
          if ($nativeManifests.Count -gt 0) { throw 'Pass44 original native stream manifest leaked into public Windows output' }
          if (Test-Path -LiteralPath 'build/output/Content/Art') {
            throw 'Owner/private or synthetic source images remained inside public CI Windows output'
          }
          $privateToolPacks = @(Get-ChildItem -Path build/output -Filter 'SourceWeaponModels.json.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($privateToolPacks.Count -gt 0) { throw 'Owner-private or synthetic Pass47 original tool model pack leaked into public output' }
          $toolManifests = @(Get-ChildItem -Path build/output -Filter 'SOURCE_WEAPON_MODELS_MANIFEST47.json' -File -Recurse -ErrorAction SilentlyContinue)
          if ($toolManifests.Count -gt 0) { throw 'Owner weapon model manifest leaked into public output' }
          $zombiePacks = @(Get-ChildItem -Path build/output -Filter 'InfectedSourceVariants.json.gz' -File -Recurse -ErrorAction SilentlyContinue)
          if ($zombiePacks.Count -gt 0) { throw 'Infected model data must not enter the public output' }
          $zombieReports = @(Get-ChildItem -Path build/output -Filter 'SOURCE_INFECTED_ASSET_KIT_MANIFEST48.json' -File -Recurse -ErrorAction SilentlyContinue)
          if ($zombieReports.Count -gt 0) { throw 'Infected source provenance file must not enter public output' }

