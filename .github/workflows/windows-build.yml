name: TWR Offline Windows Build

on:
  workflow_dispatch:
  push:
    branches: [twr-offline-dev, twr-pass29-integration]
    paths:
      - 'src/**'
      - 'content/**'
      - 'tools/**'
      - 'tests/**'
      - 'build/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read
  actions: write

jobs:
  validate-and-export:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Remove previously uploaded Windows build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Source code remains public, but previously uploaded executables are removed.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $matching = @()
          $page = 1
          do {
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page"
            $response = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
            $batch = @($response.artifacts)
            $matching += @($batch | Where-Object { $_.name -eq 'ThoseWhoRemainOffline-Windows-x64' })
            $page++
          } while ($batch.Count -eq 100)
          foreach ($artifact in $matching) {
            $url = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)"
            Invoke-RestMethod -Method Delete -Uri $url -Headers $headers | Out-Null
          }
          Write-Host "Removed $($matching.Count) previously uploaded Windows build artifact(s)."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'

      - name: Install validation dependencies
        shell: pwsh
        run: python -m pip install -e .[test]

      - name: Validate evidence/content/domain contracts
        shell: pwsh
        run: python tools/validation/run_all.py

      - name: Bootstrap pinned Godot .NET and export Windows build
        shell: pwsh
        run: .\build\Windows\build.ps1 -BootstrapToolchain -SkipTests

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'build/output/ThoseWhoRemainOffline.exe')) { throw 'Missing Windows executable' }

      - name: Smoke test Pass 29 contracts in the exported executable
        shell: pwsh
        run: |
          $output = & .\\build\\output\\ThoseWhoRemainOffline.exe --headless --quit-after 120 -- --smoke-pass29 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0 -or -not ($output | Where-Object { "$_" -match 'TWR_SMOKE_PASS29_RUNTIME_OK' })) {
            throw 'Pass 29 native Windows runtime smoke failed.'
          }

      - name: Upload verified Pass 29 Windows build (no private original assets)
        if: success() && github.ref_name == 'twr-pass29-integration'
        uses: actions/upload-artifact@v4
        with:
          name: TWR-Pass29-Windows-x64-NoPrivateAssets
          path: build/output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
