name: Source fidelity and retained Windows release
on:
  workflow_dispatch:
  push:
    branches: [twr-source-fidelity-release]
    paths:
      - 'tools/dev/**'
      - 'tools/validation/**'
      - 'tools/content/**'
      - 'tools/build/**'
      - 'build/Windows/**'
      - 'src/**'
      - 'tests/**'
      - 'content/**'
      - '.github/workflows/source-fidelity-release.yml'
concurrency:
  group: source-fidelity-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tested_commit: ${{ steps.patch.outputs.tested_commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Integrate inspected source changes
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'twr-source-fidelity-release'
          current=$(git ls-remote origin refs/heads/twr-source-fidelity-release | cut -f1)
          test "$current" = "$GITHUB_SHA"
          python tools/dev/apply_objective_playability.py
          git diff --check
          python - <<'PY'
          import subprocess
          from tools.dev.apply_objective_playability import ALLOWED, MARKER
          allowed = ALLOWED | {MARKER}
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'], text=True).splitlines())
          if not changed <= allowed:
              raise SystemExit('Unexpected source edit: ' + repr(changed - allowed))
          for path in sorted(changed):
              subprocess.run(['git','add','--',path], check=True)
          PY
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(gameplay): integrate physical Escort routes H guidance and grounded Bolter recovery'
            git push origin HEAD:refs/heads/twr-source-fidelity-release
          fi
          echo "tested_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=public-source-checkpoint.zip HEAD
      - name: Retain tracked public-source checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: TWR-PublicSource-${{ steps.patch.outputs.tested_commit }}
          path: public-source-checkpoint.zip
          retention-days: 7
  graphics:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      vblank_mode: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tested_commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - name: Install software graphics dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libx11-6 libxrandr2 libxi6 libxinerama1 libxcursor1
          python -m pip install -e .[test] PyYAML
      - name: Real-renderer geometry assertions and engine captures
        run: python tools/validation/run_graphics_validation.py
      - name: Retain graphics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWR-Graphics-${{ needs.prepare.outputs.tested_commit }}
          path: build/graphics-validation/*
          if-no-files-found: error
          retention-days: 30
      - name: Package local-verification harness
        run: python tools/build/package_linux_qa_harness.py --include-sdk
      - name: Retain public-only Linux QA harness
        uses: actions/upload-artifact@v4
        with:
          name: TWR-Linux-QA-${{ needs.prepare.outputs.tested_commit }}
          path: build/qa-harness/*.zip
          compression-level: 0
          retention-days: 3
  verify:
    needs: [prepare, graphics]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tested_commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.425'
      - uses: actions/download-artifact@v5
        with:
          name: TWR-Graphics-${{ needs.prepare.outputs.tested_commit }}
          path: build/graphics-validation
      - name: Dependencies
        shell: pwsh
        run: python -m pip install -e .[test] PyYAML
      - name: Complete content and Python regression
        shell: pwsh
        run: |
          python tools/validation/run_all.py
          if ($LASTEXITCODE -ne 0) { throw 'Content or Python validation failed' }
          python tools/build/package_source_safe.py --check-inputs
          if ($LASTEXITCODE -ne 0) { throw 'Source-safe input audit failed' }
      - name: Export native Windows game
        id: export
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'build/source-fidelity-validation' | Out-Null
          try {
            & .\build\Windows\build.ps1 -BootstrapToolchain -SkipTests *> 'build/source-fidelity-validation/export.log'
            if ($LASTEXITCODE -ne 0) { throw "Native export failed: $LASTEXITCODE" }
            if (!(Test-Path 'build/output/ThoseWhoRemainOffline.exe')) { throw 'Executable missing' }
          } finally {
            if (Test-Path 'build/source-fidelity-validation/export.log') {
              Select-String -Path 'build/source-fidelity-validation/export.log' -Pattern 'error CS|ERROR:|Build FAILED' -Context 2,3
              Get-Content 'build/source-fidelity-validation/export.log' -Tail 45
            }
          }
      - name: Native Escort routes grounded Bolters guidance and inherited interactions
        if: always() && steps.export.outcome == 'success'
        shell: pwsh
        run: python tools/validation/run_source_fidelity.py
      - name: Retain targeted diagnostics immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWR-Targeted-${{ needs.prepare.outputs.tested_commit }}
          path: build/source-fidelity-validation/*
          if-no-files-found: warn
          retention-days: 30
      - name: Repeated native shutdown regressions
        if: always() && steps.export.outcome == 'success'
        shell: pwsh
        run: python tools/validation/run_runtime_matrix.py --focus
      - name: Complete inherited native acceptance matrix
        if: always() && steps.export.outcome == 'success'
        shell: pwsh
        run: python tools/validation/run_runtime_matrix.py
      - name: Package and launch from clean folder with bundled runtime
        shell: pwsh
        run: python tools/build/package_source_safe.py
      - name: Retain source-safe playable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TWR-SourceSafe-Windows-${{ needs.prepare.outputs.tested_commit }}
          path: build/deliverables/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain release receipt separately
        uses: actions/upload-artifact@v4
        with:
          name: TWR-Release-Receipt-${{ needs.prepare.outputs.tested_commit }}
          path: build/deliverables/release-receipt.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TWR-Validation-${{ needs.prepare.outputs.tested_commit }}
          path: |
            build/source-fidelity-validation/*
            build/runtime-validation/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report exact tested revision
        if: always()
        shell: pwsh
        run: |
          Write-Host "TESTED_COMMIT=$(git rev-parse HEAD)"
          Get-ChildItem 'build/runtime-validation/*.json','build/source-fidelity-validation/*.json','build/deliverables/*.json' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "RECEIPT=$($_.Name)"
            Get-Content $_.FullName
          }
  continuation:
    needs: [prepare, graphics, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TESTED_COMMIT: ${{ needs.prepare.outputs.tested_commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tested_commit }}
      - uses: actions/download-artifact@v5
        with:
          name: TWR-Release-Receipt-${{ needs.prepare.outputs.tested_commit }}
          path: build/deliverables
      - name: Preserve canonical continuation and exact tested source
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin refs/heads/twr-source-fidelity-release | cut -f1)
          if [ "$current" != "$TESTED_COMMIT" ]; then
            echo "Branch changed during validation: expected $TESTED_COMMIT, current $current. Refusing to overwrite concurrent work."
            exit 1
          fi
          python tools/dev/write_release_handoff.py
          git diff --check
          git add docs/development/CURRENT_IMPLEMENTATION_STATUS.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: record retained source-safe release and precise continuation gaps'
            git push origin HEAD:refs/heads/twr-source-fidelity-release
          fi
          echo "SOURCE_TESTED=$TESTED_COMMIT"
          echo "CONTINUATION_COMMIT=$(git rev-parse HEAD)"
