name: Native runtime failure diagnosis
on:
  workflow_dispatch:
  push:
    branches: [twr-runtime-stabilization]
    paths: ['.github/workflows/runtime-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect-known-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract precise native exception stack
        uses: actions/github-script@v7
        with:
          script: |
            const jobId = 116275459614;
            const meta = await github.rest.actions.getJobForWorkflowRun({...context.repo, job_id: jobId});
            console.log(JSON.stringify({jobId, conclusion: meta.data.conclusion, failed: meta.data.steps.filter(s => s.conclusion === 'failure').map(s => s.name)}));
            const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {...context.repo, job_id: jobId});
            const text = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
            const lines = text.split(/\r?\n/).map(s => s.replace(/\x1b\[[0-9;]*m/g, ''));
            const indices = lines.map((s,i) => (/Fatal error\. System\.AccessViolationException|TWR_SMOKE_PASS(?:90|92|94).*FAILED/.test(s) && !s.includes('Where-Object')) ? i : -1).filter(i => i >= 0).slice(-3);
            for (const index of indices) {
              console.log('NATIVE_EXCEPTION_CONTEXT_BEGIN');
              for (const line of lines.slice(Math.max(0,index-8),index+35)) console.log(line.slice(0,2500));
              console.log('NATIVE_EXCEPTION_CONTEXT_END');
            }
            if (!indices.length) console.log(lines.slice(-40).join('\n'));
