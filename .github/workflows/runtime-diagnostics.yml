name: Native runtime failure diagnosis
on:
  workflow_dispatch:
  push:
    branches: [twr-runtime-stabilization]
    paths: ['.github/workflows/runtime-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect-known-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract native failure evidence without replaying megabyte logs
        uses: actions/github-script@v7
        with:
          script: |
            const jobId = 116275459614;
            const meta = await github.rest.actions.getJobForWorkflowRun({...context.repo, job_id: jobId});
            const failed = meta.data.steps.filter(s => s.conclusion === 'failure');
            console.log(JSON.stringify({jobId, conclusion: meta.data.conclusion, failed: failed.map(s => s.name)}));
            const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {...context.repo, job_id: jobId});
            const text = typeof response.data === 'string' ? response.data : Buffer.from(response.data).toString('utf8');
            const lines = text.split(/\r?\n/).map(s => s.replace(/\x1b\[[0-9;]*m/g, ''));
            const start = lines.findLastIndex(s => s.includes('TWR_PASS94_ROUTE_DIAGNOSTIC'));
            const relevant = lines.slice(Math.max(0,start)).filter(s => /TWR_PASS94|TWR_SMOKE_PASS94|InvalidOperationException|Exception:|native shutdown|exit|Fatal error|AccessViolationException|##\[error\]/i.test(s));
            console.log('NATIVE_FAILURE_EXCERPT_BEGIN');
            for (const line of relevant.slice(-24)) console.log(line.slice(0,3000));
            console.log('NATIVE_FAILURE_EXCERPT_END');
            await core.summary.addHeading('Native failure evidence').addCodeBlock(JSON.stringify({jobId, failed: failed.map(s => s.name), lines: relevant.slice(-24)}, null, 2)).write();
